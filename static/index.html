<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math AI Grader - Intelligent Pipeline</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <i data-lucide="brain-circuit" class="logo-icon"></i>
                <h1>Math AI Grader</h1>
            </div>
            <p class="subtitle">Automated Extraction & Intelligent Evaluation</p>
        </header>

        <section id="upload-section" class="panel glass-panel fade-in">
            <div class="upload-area" id="drop-zone">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-content">
                    <div class="upload-icon-container">
                        <i data-lucide="upload-cloud" class="upload-icon"></i>
                    </div>
                    <h2>Upload Math Solution</h2>
                    <p>Drag and drop your image here, or <span class="text-highlight">browse files</span></p>
                    <span class="file-hint">Supports PNG, JPG, JPEG</span>
                </div>
            </div>
            <div class="loading-state hidden" id="upload-loading">
                <div class="spinner"></div>
                <p>Extracting text and analyzing math...</p>
            </div>
        </section>

        <!-- Container for split view after upload -->
        <div class="results-grid hidden" id="results-container">
            
            <!-- Left Column: Image -->
            <div class="left-column">
                <section class="panel glass-panel slide-up" style="animation-delay: 0.1s">
                    <div class="panel-header">
                        <h3><i data-lucide="image"></i> Original Image</h3>
                    </div>
                    <div class="image-preview-container">
                        <img id="preview-image" src="" alt="Uploaded math solution">
                    </div>
                </section>
            </div>

            <!-- Right Column: Structured Grading Output -->
            <div class="right-column">
                <section class="panel glass-panel slide-up" id="grading-results-panel" style="animation-delay: 0.2s">
                    <div class="panel-header grading-header">
                        <h3><i data-lucide="award"></i> Final Evaluation</h3>
                        <div class="score-display">
                            <span class="score-value" id="total-score">0</span>
                            <span class="score-divider">/</span>
                            <span class="score-max" id="max-score">10</span>
                        </div>
                    </div>
                    
                    <div class="feedback-card">
                        <h4>Overall Feedback</h4>
                        <p id="overall-feedback">Loading feedback...</p>
                    </div>

                    <div class="panel-header mt-4">
                        <h3><i data-lucide="clipboard-check"></i> Step-by-Step Grading</h3>
                    </div>
                    <div class="grading-steps-container" id="grading-steps-container">
                        <!-- Graded steps will be dynamically added here -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- MathJax for rendering equations -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
